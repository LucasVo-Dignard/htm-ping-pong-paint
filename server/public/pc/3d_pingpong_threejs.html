<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ping Pong Ball - Three.js Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            letter-spacing: 2px;
        }

        .control-panel {
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 25px;
            backdrop-filter: blur(10px);
            width: 350px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            pointer-events: all;
        }

        .control-panel h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff00ff;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 0, 255, 0.05);
            border: 1px solid #ff00ff;
            border-radius: 4px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 11px;
            background: #ff00ff;
            color: #0a0a1a;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
        }

        button:hover:not(:disabled) {
            background: #ff33ff;
            box-shadow: 0 6px 25px rgba(255, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-panel {
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            width: 350px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            pointer-events: all;
        }

        .status-panel h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            padding: 8px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 3px;
        }

        .info-label {
            color: #00ff88;
        }

        .info-value {
            color: #ff00ff;
            font-weight: bold;
        }

        .queued-indicator {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #00ff88;
            border-radius: 4px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            color: #666;
        }

        .queued-indicator.active {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
        }

        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .status-bar {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 12px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            pointer-events: all;
        }

        @media (max-width: 768px) {
            .ui-container {
                flex-direction: column;
                gap: 10px;
            }

            .control-panel,
            .status-panel {
                width: 100%;
                max-width: 90vw;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="ui-container">
        <div class="title">3D PING PONG ⚬</div>
        
        <div>
            <div class="control-panel">
                <h2>⚙️ Launch</h2>
                
                <div class="input-group">
                    <label for="speed">Speed</label>
                    <input type="number" id="speed" placeholder="10" min="1" max="30" step="0.5" value="10">
                </div>

                <div class="input-group">
                    <label for="angleX">Horizontal Angle (°)</label>
                    <input type="number" id="angleX" placeholder="0" min="-45" max="45" step="1" value="0">
                </div>

                <div class="input-group">
                    <label for="angleY">Vertical Angle (°)</label>
                    <input type="number" id="angleY" placeholder="5" min="-45" max="45" step="1" value="5">
                </div>

                <div style="border-top: 1px solid rgba(255,0,255,0.3); margin: 16px 0 16px; padding-top: 16px;">
                    <div style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#ff00ff; margin-bottom:12px;">📐 Board Distance</div>
                    <div style="display:flex; gap:10px;">
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label for="boardNear">Near (Z)</label>
                            <input type="number" id="boardNear" placeholder="-5" min="-30" max="-1" step="0.5" value="-5" oninput="updateBoard()">
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label for="boardFar">Far (Z)</label>
                            <input type="number" id="boardFar" placeholder="-14" min="-60" max="-2" step="0.5" value="-14" oninput="updateBoard()">
                        </div>
                    </div>
                    <div style="font-size:10px; color:#666; margin-top:8px; text-align:center;">
                        Near = closest bounce point · Far = where board sits
                    </div>
                </div>

                <div class="button-group">
                    <button id="launchBtn" onclick="launchBall()">▶ LAUNCH</button>
                    <button id="resetBtn" onclick="resetScene()">⟲ RESET</button>
                </div>

                <div class="queued-indicator" id="queuedIndicator">
                    No input queued
                </div>
            </div>

            <div class="status-panel" style="margin-top: 20px;">
                <h3>📊 Ball State</h3>
                <div class="info-item">
                    <span class="info-label">Distance:</span>
                    <span class="info-value" id="infoZ">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Speed:</span>
                    <span class="info-value" id="infoSpeed">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Height:</span>
                    <span class="info-value" id="infoY">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="infoStatus">Ready</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-ui">
        <div class="status-bar" id="statusBar">Ready • Press LAUNCH to begin</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Three.js Scene Setup
        let scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // ── CAMERA: wider FOV + much closer to the action ──────────────────────
        let camera = new THREE.PerspectiveCamera(
            95,                                    // wider FOV for immersive feel
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 1.2, 3);           // eye-level, right at the near end
        camera.lookAt(0, 1.5, -12);               // look toward the board

        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        document.body.appendChild(renderer.domElement);

        // Lighting
        let ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        let directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 15, 10);
        scene.add(directionalLight);

        // Grid
        let gridHelper = new THREE.GridHelper(50, 50, 0x444444, 0x222222);
        gridHelper.position.z = -10;
        scene.add(gridHelper);

        // ── BOARD: bigger and closer so it fills the far end ───────────────────
        let BOARD_Z   = -14;
        let BOARD_NEAR =  -5;  // near bounce wall Z
        const BOARD_W = 40;
        const BOARD_H = 28;

        let boardGeometry = new THREE.PlaneGeometry(BOARD_W, BOARD_H);
        let boardMaterial = new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            metalness: 0.1,
            roughness: 0.2
        });
        let board = new THREE.Mesh(boardGeometry, boardMaterial);
        board.position.set(0, BOARD_H / 2 - 4, BOARD_Z);
        scene.add(board);

        // Camera is fixed at z=3; keep near wall always in front of it
        const CAMERA_Z = 3;
        const NEAR_WALL_MAX = CAMERA_Z - 0.5; // ball can get at most this close (z=2.5)

        function updateBoard() {
            const nearVal = parseFloat(document.getElementById('boardNear').value);
            const farVal  = parseFloat(document.getElementById('boardFar').value);

            if (isNaN(nearVal) || isNaN(farVal)) return;
            if (nearVal <= farVal) return; // still typing, ignore

            // Clamp near so ball never passes behind the camera
            BOARD_NEAR = Math.min(nearVal, NEAR_WALL_MAX);
            BOARD_Z    = farVal;

            // Move the board mesh
            board.position.z = BOARD_Z;

            // If ball isn't flying, snap it to new near position
            if (!isFlying) {
                ballPhysics.pos.z = BOARD_NEAR;
            }
        }

        // Ball
        let ballGeometry = new THREE.SphereGeometry(0.2, 32, 32);
        let ballMaterial = new THREE.MeshStandardMaterial({
            color: 0xff6b35,
            metalness: 0.3,
            roughness: 0.4,
            emissive: 0xff4500,
            emissiveIntensity: 0.1
        });
        let ballMesh = new THREE.Mesh(ballGeometry, ballMaterial);
        scene.add(ballMesh);

        // Physics simulation (simplified)
        let ballPhysics = {
            pos: new THREE.Vector3(0, 1, BOARD_NEAR),
            vel: new THREE.Vector3(0, 0, 0),
            radius: 0.2,
            gravity: 0.08,
            damping: 0.995,
            bounceDamping: 0.85
        };

        let isFlying = false;
        let queuedInput = null;

        function launchBall() {
            if (isFlying && !queuedInput) {
                queueInput();
                return;
            }

            if (isFlying) return;

            let speed = parseFloat(document.getElementById('speed').value) || 10;
            let angleX = (parseFloat(document.getElementById('angleX').value) || 0) * Math.PI / 180;
            let angleY = (parseFloat(document.getElementById('angleY').value) || 0) * Math.PI / 180;

            let horizComponent = Math.cos(angleY);
            ballPhysics.vel.x = speed * Math.sin(angleX) * horizComponent;
            ballPhysics.vel.y = speed * Math.sin(angleY);
            ballPhysics.vel.z = -speed * Math.cos(angleX) * horizComponent;

            isFlying = true;
            queuedInput = null;
            document.getElementById('queuedIndicator').classList.remove('active');
            document.getElementById('queuedIndicator').textContent = 'No input queued';
            updateStatus();
        }

        function queueInput() {
            queuedInput = true;
            document.getElementById('queuedIndicator').classList.add('active');
            document.getElementById('queuedIndicator').textContent = '✓ Input queued - will launch on return';
        }

        function resetScene() {
            ballPhysics.pos.set(0, 1, BOARD_NEAR);
            ballPhysics.vel.set(0, 0, 0);
            isFlying = false;
            queuedInput = null;
            document.getElementById('queuedIndicator').classList.remove('active');
            document.getElementById('queuedIndicator').textContent = 'No input queued';
            updateStatus();
        }

        function updateStatus() {
            let launchBtn = document.getElementById('launchBtn');
            if (isFlying) {
                document.getElementById('statusBar').textContent = 'Ball in flight... Press LAUNCH to queue next shot';
                launchBtn.textContent = queuedInput ? '✓ QUEUED' : '⏱ QUEUE';
            } else {
                document.getElementById('statusBar').textContent = 'Ready • Press LAUNCH to begin';
                launchBtn.textContent = '▶ LAUNCH';
            }
            document.getElementById('infoStatus').textContent = isFlying ? 'Flying' : 'Idle';
        }

        function updateInfo() {
            let speed = ballPhysics.vel.length();
            document.getElementById('infoZ').textContent = Math.abs(ballPhysics.pos.z).toFixed(1);
            document.getElementById('infoSpeed').textContent = speed.toFixed(2);
            document.getElementById('infoY').textContent = ballPhysics.pos.y.toFixed(2);
        }

        function updatePhysics() {
            if (!isFlying) return;

            // Gravity
            ballPhysics.vel.y -= ballPhysics.gravity;

            // Damping
            ballPhysics.vel.multiplyScalar(ballPhysics.damping);

            // Stop if too slow
            if (ballPhysics.vel.length() < 0.01) {
                ballPhysics.vel.set(0, 0, 0);
            }

            // Update position
            ballPhysics.pos.add(ballPhysics.vel);

            // ── Compute visible bounds at ball's current Z so it stays on screen ──
            const distToCamera = Math.abs(ballPhysics.pos.z - CAMERA_Z);
            const halfH = distToCamera * Math.tan((95 / 2) * Math.PI / 180);
            const halfW = halfH * (window.innerWidth / window.innerHeight);
            const r = ballPhysics.radius;

            // Horizontal
            if (ballPhysics.pos.x > halfW - r) {
                ballPhysics.pos.x = halfW - r;
                ballPhysics.vel.x *= -ballPhysics.bounceDamping;
            }
            if (ballPhysics.pos.x < -(halfW - r)) {
                ballPhysics.pos.x = -(halfW - r);
                ballPhysics.vel.x *= -ballPhysics.bounceDamping;
            }
            // Vertical
            const camY = 1.2; // camera.position.y
            if (ballPhysics.pos.y > camY + halfH - r) {
                ballPhysics.pos.y = camY + halfH - r;
                ballPhysics.vel.y *= -ballPhysics.bounceDamping;
            }
            if (ballPhysics.pos.y < camY - halfH + r) {
                ballPhysics.pos.y = camY - halfH + r;
                ballPhysics.vel.y *= -ballPhysics.bounceDamping;
            }

            // Board collision (at BOARD_Z)
            if (ballPhysics.pos.z < BOARD_Z) {
                ballPhysics.pos.z = BOARD_Z;
                ballPhysics.vel.z *= -ballPhysics.bounceDamping;

                if (ballPhysics.vel.z > -0.1 && ballPhysics.vel.length() < 2) {
                    if (queuedInput) {
                        setTimeout(launchBall, 400);
                    } else {
                        isFlying = false;
                        updateStatus();
                    }
                }
            }

            // Return to user (near wall)
            if (ballPhysics.pos.z > BOARD_NEAR) {
                ballPhysics.pos.z = BOARD_NEAR;
                ballPhysics.vel.z *= -ballPhysics.bounceDamping;
                
                if (ballPhysics.vel.length() < 1) {
                    isFlying = false;
                    updateStatus();
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            updatePhysics();
            
            // Update ball mesh position
            ballMesh.position.copy(ballPhysics.pos);

            updateInfo();

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Keyboard input
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && isFlying && !queuedInput) {
                queueInput();
            } else if (e.key === ' ') {
                e.preventDefault();
                launchBall();
            }
        });

        // Initialize
        resetScene();
        animate();
    </script>
</body>
</html>
