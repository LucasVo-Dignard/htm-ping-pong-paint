<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ping Pong Ball - Three.js Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            letter-spacing: 2px;
        }

        .control-panel {
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 25px;
            backdrop-filter: blur(10px);
            width: 350px;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
            pointer-events: all;
        }

        .control-panel h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff00ff;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 0, 255, 0.05);
            border: 1px solid #ff00ff;
            border-radius: 4px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 11px;
            background: #ff00ff;
            color: #0a0a1a;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 255, 0.3);
        }

        button:hover:not(:disabled) {
            background: #ff33ff;
            box-shadow: 0 6px 25px rgba(255, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-panel {
            background: rgba(10, 10, 26, 0.95);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            width: 350px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            pointer-events: all;
        }

        .status-panel h3 {
            color: #00ff88;
            margin-bottom: 15px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 12px;
            padding: 8px;
            background: rgba(0, 255, 136, 0.05);
            border-radius: 3px;
        }

        .info-label {
            color: #00ff88;
        }

        .info-value {
            color: #ff00ff;
            font-weight: bold;
        }

        .queued-indicator {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid #00ff88;
            border-radius: 4px;
            padding: 12px;
            margin-top: 15px;
            text-align: center;
            font-size: 11px;
            color: #666;
        }

        .queued-indicator.active {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
        }

        .bottom-ui {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }

        .status-bar {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 12px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            pointer-events: all;
        }

        #ink-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .ui-container {
                flex-direction: column;
                gap: 10px;
            }

            .control-panel,
            .status-panel {
                width: 100%;
                max-width: 90vw;
            }

            .title {
                font-size: 18px;
            }
        }
    </style>

</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="ui-container">
        <div class="title">3D PING PONG ⚬</div>

        <div>
            <div class="control-panel">
                <h2>⚙️ Launch</h2>

                <div class="input-group">
                    <label for="speed">Speed</label>
                    <input type="number" id="speed" placeholder="50" min="1" max="200" step="1" value="50">
                </div>

                <div class="input-group">
                    <label for="angleX">Horizontal Angle (°)</label>
                    <input type="number" id="angleX" placeholder="0" min="-45" max="45" step="1" value="0">
                </div>

                <div class="input-group">
                    <label for="angleY">Vertical Angle (°)</label>
                    <input type="number" id="angleY" placeholder="5" min="-45" max="45" step="1" value="5">
                </div>

                <div style="border-top: 1px solid rgba(255,0,255,0.3); margin: 16px 0 16px; padding-top: 16px;">
                    <div
                        style="font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#ff00ff; margin-bottom:12px;">
                        📐 Board Distance</div>
                    <div style="display:flex; gap:10px;">
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label for="boardNear">Near (Z)</label>
                            <input type="number" id="boardNear" placeholder="-5" min="-30" max="-1" step="0.5"
                                value="-5" oninput="updateBoard()">
                        </div>
                        <div class="input-group" style="margin-bottom:0; flex:1;">
                            <label for="boardFar">Far (Z)</label>
                            <input type="number" id="boardFar" placeholder="-10" min="-60" max="-2" step="0.5"
                                value="-10" oninput="updateBoard()">
                        </div>
                    </div>
                    <div style="font-size:10px; color:#666; margin-top:8px; text-align:center;">
                        Near = closest bounce point · Far = where board sits
                    </div>
                </div>

                <div class="button-group">
                    <button id="launchBtn" onclick="launchBall()">▶ LAUNCH</button>
                    <button id="resetBtn" onclick="resetScene()">⟲ RESET</button>
                </div>

                <div class="queued-indicator" id="queuedIndicator">
                    No input queued
                </div>
            </div>

            <div class="status-panel" style="margin-top: 20px;">
                <h3>📊 Ball State</h3>
                <div class="info-item">
                    <span class="info-label">Distance:</span>
                    <span class="info-value" id="infoZ">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Speed:</span>
                    <span class="info-value" id="infoSpeed">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Height:</span>
                    <span class="info-value" id="infoY">0.0</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value" id="infoStatus">Ready</span>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-ui">
        <div class="status-bar" id="statusBar">Ready • Press LAUNCH to begin</div>
    </div>


    <!-- Load Three.js FIRST -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load ink drawer service -->
    <script src="mobile/ink-drawer-service.js"></script>
    <!-- Load metallic sound -->
    <script src="pc/metallic-sound.js"></script>
    <!-- Then the script -->
    <script src="pc/script.js"></script>

    <div id="ballIndicator" style="
    display: none;
    position: fixed;
    pointer-events: none;
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;">

    <div style="
        width: 36px;
        height: 36px;
        background: rgba(24, 22, 22, 0.9);
        border: 2px solid #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        box-shadow: 0 0 10px rgba(255,107,53,0.6);"></div>
    
    <div style="
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 12px solid rgb(255, 255, 255);"></div>
</div>

</html>
