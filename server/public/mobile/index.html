<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ping Pong Paint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile/styles.css">
</head>
<body>
  <div class="lobby">
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="status-text">Ready</span>
    </div>

    <div class="mobile-panel">
      <h1>Ping Pong Paint</h1>
      <p class="lead">Enter a 4-letter room code and tap Join to connect.</p>

      <form class="form-group" id="join-form" novalidate>
        <label for="room-code">Room Code</label>
        <input id="room-code" name="room-code" type="text" maxlength="4" minlength="4" autocomplete="off"
          pattern="[A-Za-z]{4}" placeholder="ABCD" inputmode="text" required />
        <p id="error-message" class="error hidden">Enter exactly 4 letters.</p>
        <button type="submit" class="start-btn">Join</button>
      </form>

      <p class="code-label">Only letters are accepted. Example: PLAY</p>
    </div>
  </div>
  <script>
    const form = document.getElementById('join-form');
    const roomCodeInput = document.getElementById('room-code');
    const errorMessage = document.getElementById('error-message');

    function validateRoomCode(value) {
      return /^[A-Za-z]{4}$/.test(value);
    }

    roomCodeInput.addEventListener('input', () => {
      roomCodeInput.value = roomCodeInput.value.replace(/[^A-Za-z]/g, '').toUpperCase();
      if (errorMessage.classList.contains('hidden')) return;
      if (validateRoomCode(roomCodeInput.value)) {
        errorMessage.classList.add('hidden');
      }
    });

    form.addEventListener('submit', (event) => {
      const value = roomCodeInput.value.trim();
      if (!validateRoomCode(value)) {
        event.preventDefault();
        errorMessage.textContent = value.length === 0
          ? 'Room code is required.'
          : 'Enter exactly 4 letters.';
        errorMessage.classList.remove('hidden');
        roomCodeInput.focus();
      }
    });
  </script>
</body>
</html>
