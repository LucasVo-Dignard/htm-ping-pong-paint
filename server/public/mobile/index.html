<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ping Pong Paint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/mobile/styles.css">
</head>
<body>
  <div class="lobby">
    <div class="status-pill">
      <span class="dot" id="dot"></span>
      <span id="status-text">Ready</span>
    </div>

    <!-- app container expected by mobile/outline.js -->
    <div id="app">
      <div class="page-card mobile-panel">
        <h1>Ping Pong Paint</h1>
        <p class="lead">Enter a 4-letter room code and tap Join to connect.</p>

        <!-- replaced <form> with a div to avoid page reloads -->
        <div class="form-group" id="join-group" novalidate>
          <label for="code-input">Room Code</label>
          <input id="code-input" name="code" type="text" maxlength="4" minlength="4" autocomplete="off"
            pattern="[A-Za-z]{4}" placeholder="ABCD" inputmode="text" required />
          <button id="join-btn" type="button" class="start-btn join-btn">Join</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/mobile/outline.js" defer></script>
</body>
</html>
